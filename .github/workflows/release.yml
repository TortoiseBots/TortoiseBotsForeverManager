name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        type: choice
        description: 'Release increment type'
        options:
          - 'patch (bug fixes, tidy up, small tweaks: 0.0.X)'
          - 'minor (new features, new panels: 0.X.0)'
          - 'major (breaking changes: X.0.0)'
          - 'custom (specify custom version below)'
        default: 'patch (bug fixes, tidy up, small tweaks: 0.0.X)'
      custom_version:
        description: 'Custom version (used if custom selected, e.g. 3.0.0)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.actor == 'Sagiroth' || github.actor == 'sagiroth'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Lua tests
        run: |
          sudo apt-get update -qq && sudo apt-get install -y lua5.1
          lua5.1 tests/regression.lua .
          lua5.1 tests/lint.lua .
          sh tests/ui_smoke.sh .

      - name: Compute version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
          CUSTOM_VER: ${{ inputs.custom_version }}
        run: |
          python3 - << 'EOF'
          import os, re

          toc = "TortoiseBotsForeverManager.toc"
          text = open(toc, encoding="utf-8").read()
          current = re.search(r"(?m)^## Version:\s*(\d+)\.(\d+)\.(\d+)", text)
          if not current:
              raise SystemExit(f"no X.Y.Z '## Version:' line in {toc}")
          maj, min_, pat = map(int, current.groups())

          bump = os.environ["BUMP"]
          custom = os.environ.get("CUSTOM_VER", "").strip().lstrip("v")
          if bump.startswith("custom"):
              if not re.fullmatch(r"\d+\.\d+\.\d+", custom):
                  raise SystemExit(f"custom version must be X.Y.Z, got '{custom}'")
              target = custom
          elif bump.startswith("major"):
              target = f"{maj + 1}.0.0"
          elif bump.startswith("minor"):
              target = f"{maj}.{min_ + 1}.0"
          else:
              target = f"{maj}.{min_}.{pat + 1}"

          print(f"Release version: {target} (was {maj}.{min_}.{pat})")
          text = re.sub(r"(?m)^## Version:.*$", f"## Version: {target}", text)
          open(toc, "w", encoding="utf-8").write(text)

          path = "Constants.lua"
          consts = open(path, encoding="utf-8").read()
          consts = re.sub(r'TB\.C\.VERSION\s*=\s*"[^"]*"', f'TB.C.VERSION = "{target}"', consts)
          open(path, "w", encoding="utf-8").write(consts)

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"tag=v{target}\n")
          EOF

      # Needs the secret OPENCODE_API_KEY and OPENCODE_ENDPOINT + OPENCODE_MODEL
      # (variables or secrets); OPENCODE_REASONING_EFFORT (e.g. high) is optional.
      # Without the key the release falls back to GitHub's list of merged PRs.
      - name: Generate changelog with AI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENCODE_ENDPOINT: ${{ vars.OPENCODE_ENDPOINT || secrets.OPENCODE_ENDPOINT }}
          OPENCODE_MODEL: ${{ vars.OPENCODE_MODEL || secrets.OPENCODE_MODEL }}
          OPENCODE_REASONING_EFFORT: ${{ vars.OPENCODE_REASONING_EFFORT || secrets.OPENCODE_REASONING_EFFORT }}
        run: |
          if [ -z "$OPENCODE_API_KEY" ]; then
            echo "No OPENCODE_API_KEY secret, skipping the AI changelog"; exit 0
          fi
          TAG="${{ steps.version.outputs.tag }}"
          python3 tools/generate_changelog.py \
            --write \
            --out-notes /tmp/release_notes.md \
            --tag "$TAG" \
            --date "$TAG ($(date -u +%Y-%m-%d))"

      - name: Commit version and tag
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists" >&2; exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add TortoiseBotsForeverManager.toc Constants.lua
          [ -f CHANGELOG.md ] && git add CHANGELOG.md
          git commit -m "release $TAG [skip ci]" || echo "Nothing to commit"
          git pull --rebase origin main
          git push origin HEAD:main
          git tag "$TAG"
          git push origin "$TAG"

      - name: Package addon zip
        run: |
          git archive --format=zip --prefix=TortoiseBotsForeverManager/ -o /tmp/TortoiseBotsForeverManager.zip HEAD -- . \
            ':!tests' ':!tools' ':!docs' ':!.github' ':!.gitignore' ':!.luacheckrc'

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          NOTES=(--generate-notes)
          [ -f /tmp/release_notes.md ] && NOTES=(--notes-file /tmp/release_notes.md)
          gh release create "$TAG" /tmp/TortoiseBotsForeverManager.zip \
            --repo "${{ github.repository }}" \
            --title "TortoiseBotsForeverManager $TAG" \
            "${NOTES[@]}" \
            --latest
